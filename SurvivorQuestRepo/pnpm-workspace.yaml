packages:
  - apps/*
allowBuilds:
  "@nestjs/core": true
  "@prisma/client": true
  "@prisma/engines": true
  prisma: true
  sharp: true
  unrs-resolver: true
minimumReleaseAge: 1440
overrides:
  # postcss 8.5.28 (opublikowany 2026-09-03T15:13Z) nie przechodzi polityki
  # minimumReleaseAge na builderach EAS. Pin na poprzednią łatkę tylko dla
  # @expo/metro-config; Next.js (8.4.31) i Tailwind (8.5.6) zostają nietknięte.
  "@expo/metro-config>postcss": 8.5.27
